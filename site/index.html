<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Atmospheric Fauna Analytics</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

    <header>
        <h1>🌲 Atmospheric Fauna</h1>
        <p>Project Analytics</p>
    </header>

    <main>

        <section class="stats-grid">

            <div class="stat-card">
                <span>Total Downloads</span>
                <strong id="total-downloads">—</strong>
            </div>

            <div class="stat-card">
                <span>Modrinth Downloads</span>
                <strong id="modrinth-downloads">—</strong>
            </div>

            <div class="stat-card">
                <span>Followers</span>
                <strong id="followers">—</strong>
            </div>

        </section>

        <section class="chart-section">
            <h2>Downloads Over Time</h2>

            <canvas id="downloads-chart"></canvas>
        </section>

    </main>

    <script src="app.js"></script>

</body>
</html>
